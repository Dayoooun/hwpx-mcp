# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 하네스 표준 CodeRabbit 설정 — 한도(푸시 1회=리뷰 1회, 작성자 단위)를 아낀다.
# 정본: ~/.claude/skills/harness-rules/knowledge/coderabbit-usage-and-dashboards.md
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false                          # 작업 중(draft)엔 리뷰하지 않는다
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 2   # 기본 5 → 2. 이후는 @coderabbitai review 로 1회
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
      - "DO NOT MERGE"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.next/**"
    - "!**/coverage/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/*.min.js"
    - "!**/*.map"
    - "!**/*.snap"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.pdf"
    - "!**/*.hwpx"
chat:
  art: false
